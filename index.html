<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ACHOPIXEL — En construcción</title>
<meta name="description" content="achopixel — sitio en construcción / site under construction.">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root{
    --bg:oklch(0.16 0.008 60);
    --ink:oklch(0.95 0.006 85);
    --muted:oklch(0.66 0.01 85);
    --line:oklch(0.28 0.01 60);
    --accent:oklch(0.74 0.16 62);
    --sans:Archivo,"Helvetica Neue",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--mono);
    min-height:100svh;
    display:flex;
    align-items:center;
    padding:clamp(24px,6vw,80px);
    padding-left:max(clamp(24px,6vw,80px),env(safe-area-inset-left));
    padding-right:max(clamp(24px,6vw,80px),env(safe-area-inset-right));
    padding-top:max(clamp(24px,6vw,80px),env(safe-area-inset-top));
    padding-bottom:max(clamp(24px,6vw,80px),env(safe-area-inset-bottom));
    -webkit-text-size-adjust:100%;
  }
  main{width:100%;max-width:820px;margin:0 auto}
  .marca{
    font-family:var(--sans);
    font-weight:900;
    font-size:clamp(38px,9vw,92px);
    line-height:0.92;
    letter-spacing:-0.02em;
    margin:0;
  }
  .banda{
    height:10px;
    margin:clamp(20px,4vw,32px) 0;
    background:repeating-linear-gradient(
      -45deg,
      var(--accent) 0 10px,
      var(--bg) 10px 20px
    );
  }
  .estado{
    font-size:13px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 0 clamp(16px,3vw,24px);
  }
  p{
    font-size:clamp(14px,2.2vw,17px);
    line-height:1.6;
    color:var(--ink);
    margin:0 0 14px;
    max-width:56ch;
  }
  p.en{color:var(--muted)}
  .pie{
    margin-top:clamp(28px,5vw,44px);
    padding-top:16px;
    border-top:1px solid var(--line);
    font-size:12px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .pie a{
    color:var(--accent);
    text-transform:none;
    letter-spacing:0.04em;
    font-size:14px;
    text-decoration:none;
    border-bottom:1px solid var(--line);
    display:inline-block;
    padding:10px 0;
  }
  .pie a:hover,.pie a:focus{border-bottom-color:var(--accent)}
</style>
</head>
<body>
<main>
  <h1 class="marca">ACHOPIXEL</h1>
  <div class="banda" role="presentation"></div>
  <p class="estado">En construcción · Under construction</p>
  <p>Estamos rehaciendo esta web. Vuelve pronto.</p>
  <p class="en">We are rebuilding this site. Come back soon.</p>
  <p class="pie">
    Contacto · Contact<br>
    <a href="mailto:info@achopixel.com">info@achopixel.com</a>
  </p>
</main>
</body>
</html>
